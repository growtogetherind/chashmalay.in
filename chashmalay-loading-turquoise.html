<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chashmalay.in – Loading</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #021a1a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .shutter-scene {
    width: 100vw;
    height: 100vh;
    background: #021a1a;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .logo-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1;
    opacity: 0;
    transition: opacity 0.7s ease 0.5s;
    width: min(55vw, 340px);
  }
  .logo-center img {
    width: 100%;
    height: auto;
    object-fit: contain;
    display: block;
  }
  .logo-fallback {
    display: none;
    color: #f90;
    font-size: clamp(22px, 5vw, 42px);
    font-weight: 700;
    font-style: italic;
    text-align: center;
  }

  .shutter-track {
    position: absolute;
    top: 0; bottom: 0;
    width: clamp(10px, 2vw, 18px);
    background: linear-gradient(90deg, #011010, #033030, #011010);
    z-index: 12;
  }
  .shutter-track.left  { left: 0; }
  .shutter-track.right { right: 0; }
  .shutter-track::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      180deg,
      transparent 0px, transparent 8px,
      rgba(0,0,0,0.4) 8px, rgba(0,0,0,0.4) 10px
    );
  }

  .shutter-wrapper {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    z-index: 10;
  }

  .roller-tube {
    width: 100%;
    height: clamp(14px, 2.5vh, 22px);
    background: linear-gradient(180deg, #1a6060 0%, #0a3535 50%, #1a6060 100%);
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    padding: 0 clamp(10px, 3vw, 50px);
    flex-shrink: 0;
    border-bottom: 2px solid #011a1a;
  }
  .roller-bolt {
    width: clamp(5px, 1vw, 8px);
    height: clamp(5px, 1vw, 8px);
    border-radius: 50%;
    background: #2dd4bf;
    border: 1px solid #0a3535;
  }

  .shutter-slats {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .slat {
    flex: 1;
    border-top: 1.5px solid #0d5555;
    border-bottom: 1.5px solid #010e0e;
    background: linear-gradient(180deg,
      #0a4040 0%,
      #063030 40%,
      #042828 60%,
      #083535 100%
    );
    position: relative;
  }
  .slat::before {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 35%;
    background: rgba(45,212,191,0.04);
  }
  .slat::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 30%;
    height: 1.5px;
    background: rgba(45,212,191,0.06);
  }

  .floor-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: clamp(8px, 1.5vh, 14px);
    background: #0a3535;
    border-top: 2px solid #1a6060;
    z-index: 15;
  }

  .enter-msg {
    position: absolute;
    bottom: clamp(24px, 5vh, 48px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    color: #2dd4bf;
    font-size: clamp(12px, 1.8vw, 16px);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.8s ease;
    letter-spacing: 0.08em;
  }

  .replay-hint {
    position: absolute;
    top: 16px; right: 18px;
    color: #1a5555;
    font-size: 11px;
    z-index: 20;
    user-select: none;
  }
</style>
</head>
<body>

<div class="shutter-scene" id="scene">

  <div class="logo-center" id="logo">
    <img
      src="logochashmalay-Photoroom.png"
      alt="Chashmalay.in"
      onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='block';"
    >
    <div class="logo-fallback">Chashmalay.in</div>
  </div>

  <div class="shutter-track left"></div>
  <div class="shutter-track right"></div>

  <div class="shutter-wrapper" id="shutter">
    <div class="roller-tube" id="tube"></div>
    <div class="shutter-slats" id="slats"></div>
  </div>

  <div class="floor-bar"></div>
  <div class="enter-msg" id="enterMsg">✦ Welcome to Chashmalay.in ✦</div>
  <div class="replay-hint">click anywhere to replay</div>
</div>

<script>
  const SLAT_COUNT = 24;
  const BOLT_COUNT = 10;

  const slatsEl  = document.getElementById('slats');
  const tubeEl   = document.getElementById('tube');
  const shutter  = document.getElementById('shutter');
  const logo     = document.getElementById('logo');
  const enterMsg = document.getElementById('enterMsg');
  const scene    = document.getElementById('scene');

  for (let i = 0; i < SLAT_COUNT; i++) {
    const s = document.createElement('div');
    s.className = 'slat';
    slatsEl.appendChild(s);
  }
  for (let i = 0; i < BOLT_COUNT; i++) {
    const b = document.createElement('div');
    b.className = 'roller-bolt';
    tubeEl.appendChild(b);
  }

  function startAnimation() {
    logo.style.transition = 'none';
    logo.style.opacity = '0';
    shutter.style.transition = 'none';
    shutter.style.transform = 'translateY(0%)';
    enterMsg.style.opacity = '0';

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        shutter.style.transition = 'transform 2.4s cubic-bezier(0.35, 0, 0.2, 1)';
        shutter.style.transform  = 'translateY(-100%)';
        logo.style.transition    = 'opacity 0.7s ease 0.5s';
        logo.style.opacity       = '1';
        setTimeout(() => {
          enterMsg.style.transition = 'opacity 0.8s ease';
          enterMsg.style.opacity    = '1';
        }, 2600);
      });
    });
  }

  window.addEventListener('load', () => setTimeout(startAnimation, 300));
  scene.addEventListener('click', startAnimation);
</script>

</body>
</html>
